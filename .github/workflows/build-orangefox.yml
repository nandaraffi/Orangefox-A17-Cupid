name: "Build OrangeFox - Xiaomi 12 (cupid)"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orangefox-cupid-build
  cancel-in-progress: false

jobs:
  build:
    name: Build recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      DEVICE: cupid
      DEVICE_BRANCH: lineage-24.0
      COMMON_BRANCH: lineage-24.0
      VENDOR_BRANCH: lineage-24.0
      FOX_BRANCH: "12.1"

      DEVICE_REPO: https://github.com/nandaraffi/android_device_xiaomi_cupid.git
      COMMON_REPO: https://github.com/nandaraffi/android_device_xiaomi_sm8450-common.git

      VENDOR_DEVICE_URL: https://github.com/TheMuppets/proprietary_vendor_xiaomi_cupid.git
      VENDOR_COMMON_URL: https://github.com/TheMuppets/proprietary_vendor_xiaomi_sm8450-common.git

      HARDWARE_URL: https://github.com/LineageOS/android_hardware_xiaomi.git
      KERNEL_URL: https://github.com/LineageOS/android_kernel_xiaomi_sm8450.git
      DTBO_URL: https://github.com/LineageOS/android_kernel_xiaomi_sm8450-devicetrees.git
      MODULES_URL: https://github.com/LineageOS/android_kernel_xiaomi_sm8450-modules.git

      ANDROID_JOBS: "2"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Check disk space
        run: |
          set -eu
          df -h

      - name: Install build dependencies
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 openjdk-17-jdk

      - name: Install repo tool
        run: |
          set -eu
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download OrangeFox sync tools
        run: |
          set -eu
          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            "$GITHUB_WORKSPACE/orangefox-sync"

          test -f \
            "$GITHUB_WORKSPACE/orangefox-sync/orangefox_sync.sh"

          test -f \
            "$GITHUB_WORKSPACE/orangefox-sync/patches/patch-manifest-fox_12.1.diff"

      - name: Initialize and sync OrangeFox
        working-directory: ${{ github.workspace }}/orangefox-sync
        run: |
          set -eu
          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch "$FOX_BRANCH" \
            --path "$GITHUB_WORKSPACE/android"

      - name: Verify required branches
        run: |
          set -eu

          check_branch() {
            url="$1"
            branch="$2"
            name="$3"

            echo "Checking $name: $branch"

            if ! git ls-remote --exit-code --heads \
              "$url" "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::error::Branch $branch is unavailable for $name."
              echo "::error::No older branch fallback will be used."
              exit 1
            fi
          }

          check_branch "$DEVICE_REPO" "$DEVICE_BRANCH" "cupid device tree"
          check_branch "$COMMON_REPO" "$COMMON_BRANCH" "SM8450 common tree"
          check_branch "$VENDOR_DEVICE_URL" "$VENDOR_BRANCH" "cupid vendor tree"
          check_branch "$VENDOR_COMMON_URL" "$VENDOR_BRANCH" "SM8450 vendor tree"

          check_branch "$HARDWARE_URL" "$COMMON_BRANCH" "Xiaomi hardware"
          check_branch "$KERNEL_URL" "$COMMON_BRANCH" "SM8450 kernel"
          check_branch "$DTBO_URL" "$COMMON_BRANCH" "SM8450 device trees"
          check_branch "$MODULES_URL" "$COMMON_BRANCH" "SM8450 kernel modules"

      - name: Fetch Xiaomi 12 device tree
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"
          mkdir -p device/xiaomi

          git clone --depth=1 --branch "$DEVICE_BRANCH" \
            "$DEVICE_REPO" device/xiaomi/cupid

      - name: Fetch SM8450 common device tree
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"
          mkdir -p device/xiaomi

          git clone --depth=1 --branch "$COMMON_BRANCH" \
            "$COMMON_REPO" device/xiaomi/sm8450-common

      - name: Fetch Xiaomi hardware and kernel dependencies
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"

          mkdir -p hardware kernel/xiaomi

          git clone --depth=1 --branch "$COMMON_BRANCH" \
            "$HARDWARE_URL" hardware/xiaomi

          git clone --depth=1 --branch "$COMMON_BRANCH" \
            "$KERNEL_URL" kernel/xiaomi/sm8450

          git clone --depth=1 --branch "$COMMON_BRANCH" \
            "$DTBO_URL" kernel/xiaomi/sm8450-devicetrees

          git clone --depth=1 --branch "$COMMON_BRANCH" \
            "$MODULES_URL" kernel/xiaomi/sm8450-modules

      - name: Fetch vendor trees
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"
          mkdir -p vendor/xiaomi

          git clone --depth=1 --branch "$VENDOR_BRANCH" \
            "$VENDOR_DEVICE_URL" vendor/xiaomi/cupid

          git clone --depth=1 --branch "$VENDOR_BRANCH" \
            "$VENDOR_COMMON_URL" vendor/xiaomi/sm8450-common

      - name: Validate required files
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"

          for path in \
            device/xiaomi/cupid/BoardConfig.mk \
            device/xiaomi/cupid/device.mk \
            device/xiaomi/cupid/AndroidProducts.mk \
            device/xiaomi/cupid/lineage_cupid.mk \
            device/xiaomi/cupid/lineage.dependencies \
            device/xiaomi/sm8450-common/BoardConfigCommon.mk \
            device/xiaomi/sm8450-common/lineage.dependencies \
            vendor/xiaomi/cupid/BoardConfigVendor.mk \
            vendor/xiaomi/cupid/cupid-vendor.mk \
            vendor/xiaomi/sm8450-common
          do
            if [ ! -e "$path" ]; then
              echo "::error::Required file or directory missing: $path"
              exit 1
            fi
          done

          grep -q 'BoardConfigCommon.mk' \
            device/xiaomi/cupid/BoardConfig.mk

          grep -q 'vendor/xiaomi/cupid/BoardConfigVendor.mk' \
            device/xiaomi/cupid/BoardConfig.mk

      - name: Validate recovery build prerequisites
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"

          if [ ! -d vendor/recovery ]; then
            echo "::error::OrangeFox recovery source was not synced."
            exit 1
          fi

          if [ ! -f vendor/recovery/config/common.mk ]; then
            echo "::error::Recovery common product config is missing."
            exit 1
          fi

          echo "Device and recovery prerequisites found."

      - name: Create local recovery product
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"

          cat > device/xiaomi/cupid/twrp_cupid.mk <<'EOF'
          $(call inherit-product, device/xiaomi/cupid/device.mk)
          $(call inherit-product, vendor/recovery/config/common.mk)

          PRODUCT_DEVICE := cupid
          PRODUCT_NAME := twrp_cupid
          PRODUCT_BRAND := Xiaomi
          PRODUCT_MODEL := Xiaomi 12
          PRODUCT_MANUFACTURER := Xiaomi
          PRODUCT_RELEASE_NAME := cupid

          PRODUCT_BUILD_PROP_OVERRIDES += \
              PRODUCT_NAME=cupid \
              TARGET_DEVICE=cupid
          EOF

          if ! grep -q 'twrp_cupid.mk' \
            device/xiaomi/cupid/AndroidProducts.mk; then
            printf '\nPRODUCT_MAKEFILES += \\\n    $(LOCAL_DIR)/twrp_cupid.mk\n' \
              >> device/xiaomi/cupid/AndroidProducts.mk
          fi

          echo "Local recovery product registered."

      - name: Configure ccache
        run: |
          set -eu
          mkdir -p "$GITHUB_WORKSPACE/.ccache"

          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"

      - name: Build recovery image
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"

          export USE_CCACHE=1
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          ccache -M 5G

          source build/envsetup.sh
          lunch twrp_cupid-eng

          mka adbd recoveryimage -j"$ANDROID_JOBS"

      - name: Verify recovery image
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"

          IMAGE="out/target/product/cupid/recovery.img"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::recovery.img was not produced."

            find out/target/product/cupid \
              -maxdepth 2 -type f -name '*.img' -print || true

            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$IMAGE" "$GITHUB_WORKSPACE/output/recovery.img"

          cd "$GITHUB_WORKSPACE/output"
          sha256sum recovery.img > SHA256SUMS.txt

          ls -lh recovery.img SHA256SUMS.txt

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-cupid-recovery
          path: |
            output/recovery.img
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
