
name: Build OrangeFox Recovery - Xiaomi 12 Cupid

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: orangefox-cupid-build
  cancel-in-progress: false

jobs:
  build:
    name: Build recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      FOX_BRANCH: "16.0"
      DEVICE: "cupid"
      DEVICE_PATH: "device/xiaomi/cupid"
      COMMON_PATH: "device/xiaomi/sm8450-common"
      DEVICE_BRANCH: "lineage-24.0"
      COMMON_BRANCH: "lineage-24.0"
      VENDOR_BRANCH: "lineage-24.0"
      ANDROID_JOBS: "4"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            wget \
            xz-utils \
            zip \
            zlib1g-dev

      - name: Install Google repo tool
        shell: bash
        run: |
          set -eo pipefail

          sudo curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo

          sudo chmod 0755 /usr/local/bin/repo

          if ! command -v repo >/dev/null 2>&1; then
            echo "::error::Google repo tool gagal dipasang."
            exit 1
          fi

          echo "===== REPO VERSION ====="
          repo version

      - name: Configure Git
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -eo pipefail

          mkdir -p "$GITHUB_WORKSPACE/fox-source"

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            "$GITHUB_WORKSPACE/orangefox-sync"

          cd "$GITHUB_WORKSPACE/orangefox-sync"

          if [[ ! -f orangefox_sync.sh ]]; then
            echo "::error::orangefox_sync.sh tidak ditemukan."
            exit 1
          fi

          if ! command -v repo >/dev/null 2>&1; then
            echo "::error::Perintah repo belum tersedia."
            exit 1
          fi

          bash orangefox_sync.sh \
            --branch "$FOX_BRANCH" \
            --path "$GITHUB_WORKSPACE/fox-source"

          if [[ ! -f "$GITHUB_WORKSPACE/fox-source/build/envsetup.sh" ]]; then
            echo "::error::Source OrangeFox tidak lengkap."
            exit 1
          fi

      - name: Clone Xiaomi 12 device trees
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          mkdir -p device/xiaomi

          clone_branch() {
            local repo_url="$1"
            local branch="$2"
            local destination="$3"

            echo "Checking $repo_url ($branch)"

            if ! git ls-remote --exit-code --heads \
              "$repo_url" "$branch" >/dev/null 2>&1; then
              echo "::error::Branch $branch tidak ditemukan: $repo_url"
              exit 1
            fi

            rm -rf "$destination"

            git clone --depth=1 --single-branch \
              --branch "$branch" \
              "$repo_url" "$destination"
          }

          clone_branch \
            https://github.com/nandaraffi/android_device_xiaomi_cupid.git \
            "$DEVICE_BRANCH" \
            "$DEVICE_PATH"

          clone_branch \
            https://github.com/nandaraffi/android_device_xiaomi_sm8450-common.git \
            "$COMMON_BRANCH" \
            "$COMMON_PATH"

          for file in \
            "$DEVICE_PATH/AndroidProducts.mk" \
            "$DEVICE_PATH/BoardConfig.mk" \
            "$DEVICE_PATH/device.mk" \
            "$COMMON_PATH/BoardConfigCommon.mk"; do

            if [[ ! -f "$file" ]]; then
              echo "::error::File penting tidak ditemukan: $file"
              exit 1
            fi
          done

      - name: Clone proprietary vendor trees
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          clone_branch() {
            local repo_url="$1"
            local branch="$2"
            local destination="$3"

            if ! git ls-remote --exit-code --heads \
              "$repo_url" "$branch" >/dev/null 2>&1; then
              echo "::error::Branch $branch tidak ditemukan: $repo_url"
              exit 1
            fi

            rm -rf "$destination"

            git clone --depth=1 --single-branch \
              --branch "$branch" \
              "$repo_url" "$destination"
          }

          clone_branch \
            https://github.com/TheMuppets/proprietary_vendor_xiaomi_cupid.git \
            "$VENDOR_BRANCH" \
            vendor/xiaomi/cupid

          clone_branch \
            https://github.com/TheMuppets/proprietary_vendor_xiaomi_sm8450-common.git \
            "$VENDOR_BRANCH" \
            vendor/xiaomi/sm8450-common

          if [[ ! -f vendor/xiaomi/cupid/Android.mk &&
                ! -f vendor/xiaomi/cupid/Android.bp ]]; then
            echo "::error::Build files vendor Xiaomi cupid tidak ditemukan."
            exit 1
          fi

      - name: Check device tree and recovery configuration
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          echo "===== DEVICE TREE ====="
          ls -la "$DEVICE_PATH"

          echo "===== COMMON TREE ====="
          ls -la "$COMMON_PATH"

          echo "===== RECOVERY SETTINGS ====="
          grep -R -n -E \
            'BOARD_USES_RECOVERY_AS_BOOT|BOARD_RECOVERYIMAGE_PARTITION_SIZE|BOARD_RECOVERYIMAGE_PARTITION_NAME|TARGET_NO_RECOVERY|BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT' \
            "$DEVICE_PATH" "$COMMON_PATH" || true

          if [[ ! -f vendor/twrp/config/common.mk ]]; then
            echo "::error::vendor/twrp/config/common.mk tidak ditemukan."
            exit 1
          fi

          if [[ ! -f "$DEVICE_PATH/AndroidProducts.mk" ]]; then
            echo "::error::AndroidProducts.mk tidak ditemukan."
            exit 1
          fi

      - name: Configure OrangeFox recovery product
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          PRODUCT_MK="$DEVICE_PATH/twrp_cupid.mk"
          PRODUCTS_MK="$DEVICE_PATH/AndroidProducts.mk"

          cat > "$PRODUCT_MK" <<'EOF'
          PRODUCT_RELEASE_NAME := cupid

          DEVICE_PATH := device/xiaomi/cupid

          $(call inherit-product, $(DEVICE_PATH)/device.mk)
          $(call inherit-product-if-exists, $(DEVICE_PATH)/fox_cupid.mk)
          $(call inherit-product, vendor/twrp/config/common.mk)

          PRODUCT_NAME := twrp_cupid
          PRODUCT_DEVICE := cupid
          PRODUCT_BRAND := Xiaomi
          PRODUCT_MODEL := Xiaomi 12
          PRODUCT_MANUFACTURER := Xiaomi
          EOF

          if ! grep -q 'twrp_cupid.mk' "$PRODUCTS_MK"; then
            cat >> "$PRODUCTS_MK" <<'EOF'

          PRODUCT_MAKEFILES += \
              $(LOCAL_DIR)/twrp_cupid.mk
          EOF
          fi

          if ! grep -q 'twrp_cupid-eng' "$PRODUCTS_MK"; then
            cat >> "$PRODUCTS_MK" <<'EOF'

          COMMON_LUNCH_CHOICES += \
              twrp_cupid-eng
          EOF
          fi

          echo "===== twrp_cupid.mk ====="
          cat "$PRODUCT_MK"

          echo "===== AndroidProducts.mk ====="
          cat "$PRODUCTS_MK"

      - name: Detect release configuration
        id: release
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          RELEASE_DIR="build/release/release_configs"

          if [[ ! -d "$RELEASE_DIR" ]]; then
            echo "::error::Folder release config tidak ditemukan: $RELEASE_DIR"
            exit 1
          fi

          echo "===== AVAILABLE RELEASE CONFIGS ====="
          find "$RELEASE_DIR" -maxdepth 1 -type f \
            \( -name '*.textproto' -o -name '*.mk' \) \
            -printf '%f\n' | sort

          RELEASE=""

          for candidate in ap2a bp1a cp1a trunk_staging; do
            if [[ -f "$RELEASE_DIR/$candidate.textproto" ||
                  -f "$RELEASE_DIR/$candidate.mk" ]]; then
              if [[ "$candidate" != "trunk_staging" ]]; then
                RELEASE="$candidate"
                break
              fi
            fi
          done

          if [[ -z "$RELEASE" ]]; then
            echo "::error::Tidak ditemukan release config yang sesuai."
            exit 1
          fi

          echo "Release config terpilih: $RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build OrangeFox recovery
        shell: bash
        env:
          TARGET_RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="$DEVICE"
          export TARGET_RELEASE
          export BUILD_USERNAME=github-actions
          export BUILD_HOSTNAME=github-actions
          export LC_ALL=C

          echo "TARGET_RELEASE=$TARGET_RELEASE"

          source build/envsetup.sh

          LUNCH_TARGET="twrp_${DEVICE}-${TARGET_RELEASE}-eng"

          echo "Lunch target: $LUNCH_TARGET"

          if ! lunch "$LUNCH_TARGET"; then
            echo "::error::Lunch target gagal: $LUNCH_TARGET"
            exit 1
          fi

          mka adbd recoveryimage -j"$ANDROID_JOBS"

      - name: Verify recovery image
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          PRODUCT_OUT="out/target/product/$DEVICE"
          IMAGE=""

          for candidate in \
            "$PRODUCT_OUT/recovery.img" \
            "$PRODUCT_OUT/OrangeFox-unofficial-${DEVICE}.img" \
            "$PRODUCT_OUT/OrangeFox-${DEVICE}.img"; do

            if [[ -s "$candidate" ]]; then
              IMAGE="$candidate"
              break
            fi
          done

          if [[ -z "$IMAGE" ]]; then
            echo "::error::recovery.img tidak ditemukan."
            echo "===== OUTPUT DIRECTORY ====="
            ls -lah "$PRODUCT_OUT" || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$IMAGE" "$GITHUB_WORKSPACE/artifacts/recovery.img"

          echo "===== IMAGE INFORMATION ====="
          stat -c '%n - %s bytes' \
            "$GITHUB_WORKSPACE/artifacts/recovery.img"

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-cupid-recovery
          path: artifacts/recovery.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
