
name: Build OrangeFox Recovery - Xiaomi 12 Cupid

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-orangefox.yml"

permissions:
  contents: write

concurrency:
  group: orangefox-cupid-build
  cancel-in-progress: false

jobs:
  build:
    name: Build recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      FOX_BRANCH: "16.0"
      DEVICE: "cupid"
      DEVICE_PATH: "device/xiaomi/cupid"
      COMMON_PATH: "device/xiaomi/sm8450-common"

      DEVICE_BRANCH: "lineage-24.0"
      COMMON_BRANCH: "lineage-24.0"
      VENDOR_BRANCH: "lineage-24.0"
      KERNEL_BRANCH: "lineage-24.0"

      QCOM_COMMON_BRANCH: "lineage-21.0"
      SEPOLICY_BRANCH: "lineage-24.0-caf-sm8450"
      QCOM_WLAN_BRANCH: "lineage-24.0-caf"
      QCOM_VENDOR_BRANCH: "lineage-21.0"

      ANDROID_JOBS: "4"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        shell: bash
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h /

      - name: Install build dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex git git-lfs \
            gnupg gperf imagemagick lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush \
            python3 python-is-python3 rsync schedtool \
            squashfs-tools unzip wget xz-utils zip zlib1g-dev

      - name: Install Google repo tool
        shell: bash
        run: |
          set -eo pipefail
          sudo curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o /usr/local/bin/repo
          sudo chmod 0755 /usr/local/bin/repo
          command -v repo
          repo version

      - name: Configure Git
        shell: bash
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global http.maxRequests 5
          git config --global http.postBuffer 524288000
          git lfs install

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -eo pipefail

          FOX_SOURCE="$GITHUB_WORKSPACE/fox-source"
          SYNC_DIR="$GITHUB_WORKSPACE/orangefox-sync"

          mkdir -p "$FOX_SOURCE"

          git clone --depth=1 \
            https://gitlab.com/OrangeFox/sync.git "$SYNC_DIR"

          cd "$SYNC_DIR"

          test -f orangefox_sync.sh || {
            echo "::error::orangefox_sync.sh tidak ditemukan."
            exit 1
          }

          SYNC_OK=false

          if bash orangefox_sync.sh \
            --branch "$FOX_BRANCH" \
            --path "$FOX_SOURCE"; then
            SYNC_OK=true
          else
            echo "::warning::Sync awal gagal. Mencoba ulang."

            if [[ ! -d "$FOX_SOURCE/.repo" ]]; then
              echo "::error::.repo tidak ditemukan."
              exit 1
            fi

            cd "$FOX_SOURCE"

            for attempt in 1 2 3; do
              echo "Retry $attempt dari 3"

              if repo sync -c -j1 --force-sync \
                --no-clone-bundle --no-tags; then
                SYNC_OK=true
                break
              fi

              sleep $((attempt * 20))
            done
          fi

          if [[ "$SYNC_OK" != true ]]; then
            echo "::error::OrangeFox source gagal disinkronkan."
            exit 1
          fi

          cd "$FOX_SOURCE"
          test -f build/envsetup.sh

          repo list > "$GITHUB_WORKSPACE/repo-list.txt"
          sed -n '1,30p' "$GITHUB_WORKSPACE/repo-list.txt"

      - name: Clone Xiaomi 12 device trees
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          clone_branch() {
            local url="$1"
            local branch="$2"
            local dest="$3"

            git ls-remote --exit-code --heads \
              "$url" "$branch" >/dev/null || {
                echo "::error::Branch $branch tidak ditemukan: $url"
                exit 1
              }

            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"

            git clone --depth=1 --single-branch \
              --branch "$branch" "$url" "$dest"
          }

          clone_branch \
            https://github.com/nandaraffi/android_device_xiaomi_cupid.git \
            "$DEVICE_BRANCH" "$DEVICE_PATH"

          clone_branch \
            https://github.com/nandaraffi/android_device_xiaomi_sm8450-common.git \
            "$COMMON_BRANCH" "$COMMON_PATH"

          for file in \
            "$DEVICE_PATH/AndroidProducts.mk" \
            "$DEVICE_PATH/BoardConfig.mk" \
            "$DEVICE_PATH/device.mk" \
            "$COMMON_PATH/BoardConfigCommon.mk" \
            "$COMMON_PATH/common.mk" \
            "$COMMON_PATH/lineage.dependencies"; do
            test -f "$file" || {
              echo "::error::File penting tidak ditemukan: $file"
              exit 1
            }
          done

      - name: Clone Xiaomi kernel and hardware dependencies
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          clone_branch() {
            local url="$1"
            local branch="$2"
            local dest="$3"

            git ls-remote --exit-code --heads \
              "$url" "$branch" >/dev/null || {
                echo "::error::Branch $branch tidak ditemukan: $url"
                exit 1
              }

            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"

            git clone --depth=1 --single-branch \
              --branch "$branch" "$url" "$dest"
          }

          clone_branch \
            https://github.com/LineageOS/android_hardware_xiaomi.git \
            "$KERNEL_BRANCH" hardware/xiaomi

          clone_branch \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8450.git \
            "$KERNEL_BRANCH" kernel/xiaomi/sm8450

          clone_branch \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8450-devicetrees.git \
            "$KERNEL_BRANCH" kernel/xiaomi/sm8450-devicetrees

          clone_branch \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8450-modules.git \
            "$KERNEL_BRANCH" kernel/xiaomi/sm8450-modules

          test -s kernel/xiaomi/sm8450/modules.list.msm.waipio || {
            echo "::error::modules.list.msm.waipio tidak ditemukan."
            exit 1
          }

      - name: Clone Qualcomm CAF common and sepolicy
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          clone_branch() {
            local url="$1"
            local branch="$2"
            local dest="$3"

            git ls-remote --exit-code --heads \
              "$url" "$branch" >/dev/null || {
                echo "::error::Branch $branch tidak ditemukan: $url"
                exit 1
              }

            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"

            git clone --depth=1 --single-branch \
              --branch "$branch" "$url" "$dest"
          }

          clone_branch \
            https://github.com/LineageOS/android_hardware_qcom-caf_common.git \
            "$QCOM_COMMON_BRANCH" hardware/qcom-caf/common

          clone_branch \
            https://github.com/LineageOS/android_device_qcom_sepolicy_vndr.git \
            "$SEPOLICY_BRANCH" device/qcom/sepolicy_vndr

          test -f hardware/qcom-caf/common/common.mk
          test -f hardware/qcom-caf/common/os_pickup_qssi.bp
          test -f device/qcom/sepolicy_vndr/SEPolicy.mk

          mkdir -p hardware/qcom-caf/sm8450

          cp \
            hardware/qcom-caf/common/os_pickup_qssi.bp \
            hardware/qcom-caf/sm8450/Android.bp

          test -f hardware/qcom-caf/sm8450/Android.bp

      - name: Clone Qualcomm WLAN dependency
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          URL="https://github.com/LineageOS/android_hardware_qcom_wlan.git"

          git ls-remote --exit-code --heads \
            "$URL" "$QCOM_WLAN_BRANCH" >/dev/null || {
              echo "::error::Branch WLAN tidak ditemukan."
              exit 1
            }

          rm -rf hardware/qcom-caf/wlan
          mkdir -p hardware/qcom-caf

          git clone --depth=1 --single-branch \
            --branch "$QCOM_WLAN_BRANCH" \
            "$URL" hardware/qcom-caf/wlan

          test -f hardware/qcom-caf/wlan/Android.bp

      - name: Clone Qualcomm vendor display dependencies
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          clone_branch() {
            local repo="$1"
            local dest="$2"
            local branch="$3"
            local url="https://github.com/LineageOS/${repo}.git"

            git ls-remote --exit-code --heads \
              "$url" "$branch" >/dev/null || {
                echo "::error::Branch $branch tidak ditemukan: $repo"
                exit 1
              }

            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"

            git clone --depth=1 --single-branch \
              --branch "$branch" "$url" "$dest"
          }

          clone_branch \
            android_vendor_qcom_opensource_display-commonsys-intf \
            vendor/qcom/opensource/commonsys-intf/display \
            "$QCOM_VENDOR_BRANCH"

          clone_branch \
            android_vendor_qcom_opensource_display-commonsys \
            vendor/qcom/opensource/commonsys/display \
            "$QCOM_VENDOR_BRANCH"

          clone_branch \
            android_vendor_qcom_opensource_display \
            vendor/qcom/opensource/display \
            "$QCOM_VENDOR_BRANCH"

          clone_branch \
            android_vendor_qcom_opensource_dataservices \
            vendor/qcom/opensource/dataservices \
            "$QCOM_VENDOR_BRANCH"

          for path in \
            vendor/qcom/opensource/commonsys-intf/display \
            vendor/qcom/opensource/commonsys/display \
            vendor/qcom/opensource/display \
            vendor/qcom/opensource/dataservices; do

            test -f "$path/Android.bp" || {
              echo "::error::Android.bp tidak ditemukan: $path"
              exit 1
            }

            echo "OK: $path"
          done

          if grep -n 'export_cflags' \
            vendor/qcom/opensource/commonsys-intf/display/Android.bp; then
            echo "::error::Android.bp masih menggunakan export_cflags."
            exit 1
          fi

      - name: Clone proprietary vendor trees
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          clone_branch() {
            local url="$1"
            local branch="$2"
            local dest="$3"

            git ls-remote --exit-code --heads \
              "$url" "$branch" >/dev/null || {
                echo "::error::Branch $branch tidak ditemukan: $url"
                exit 1
              }

            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"

            git clone --depth=1 --single-branch \
              --branch "$branch" "$url" "$dest"
          }

          clone_branch \
            https://github.com/TheMuppets/proprietary_vendor_xiaomi_cupid.git \
            "$VENDOR_BRANCH" vendor/xiaomi/cupid

          clone_branch \
            https://github.com/TheMuppets/proprietary_vendor_xiaomi_sm8450-common.git \
            "$VENDOR_BRANCH" vendor/xiaomi/sm8450-common

          if [[ ! -f vendor/xiaomi/cupid/Android.mk && \
                ! -f vendor/xiaomi/cupid/Android.bp ]]; then
            echo "::error::Build files vendor Xiaomi cupid tidak ditemukan."
            exit 1
          fi

      - name: Check all Soong namespaces
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          required_paths=(
            "hardware/qcom-caf/common/common.mk"
            "hardware/qcom-caf/sm8450/Android.bp"
            "hardware/qcom-caf/wlan/Android.bp"
            "device/qcom/sepolicy_vndr/SEPolicy.mk"
            "vendor/qcom/opensource/commonsys-intf/display/Android.bp"
            "vendor/qcom/opensource/commonsys/display/Android.bp"
            "vendor/qcom/opensource/display/Android.bp"
            "vendor/qcom/opensource/dataservices/Android.bp"
            "kernel/xiaomi/sm8450/modules.list.msm.waipio"
            "vendor/twrp/config/common.mk"
          )

          for file in "${required_paths[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Dependency tidak ditemukan: $file"
              exit 1
            fi
            echo "OK: $file"
          done

          echo "===== DEVICE TREE ====="
          ls -la "$DEVICE_PATH"

          echo "===== COMMON TREE ====="
          ls -la "$COMMON_PATH"

          echo "===== RECOVERY SETTINGS ====="
          grep -R -n -E \
            'BOARD_RECOVERYIMAGE_PARTITION_SIZE|BOARD_RECOVERYIMAGE_PARTITION_NAME|TARGET_RECOVERY_FSTAB|BOARD_USES_RECOVERY_AS_BOOT' \
            "$DEVICE_PATH" "$COMMON_PATH" || true

      - name: Configure OrangeFox recovery product
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          PRODUCT_MK="$DEVICE_PATH/twrp_cupid.mk"
          PRODUCTS_MK="$DEVICE_PATH/AndroidProducts.mk"

          cat > "$PRODUCT_MK" <<'EOF'
          PRODUCT_RELEASE_NAME := cupid

          DEVICE_PATH := device/xiaomi/cupid

          TW_THEME := portrait_hdpi

          $(call inherit-product, $(DEVICE_PATH)/device.mk)
          $(call inherit-product-if-exists, $(DEVICE_PATH)/fox_cupid.mk)
          $(call inherit-product, vendor/twrp/config/common.mk)

          PRODUCT_NAME := twrp_cupid
          PRODUCT_DEVICE := cupid
          PRODUCT_BRAND := Xiaomi
          PRODUCT_MODEL := Xiaomi 12
          PRODUCT_MANUFACTURER := Xiaomi
          EOF

          if ! grep -q 'twrp_cupid.mk' "$PRODUCTS_MK"; then
            cat >> "$PRODUCTS_MK" <<'EOF'

          PRODUCT_MAKEFILES += \
              $(LOCAL_DIR)/twrp_cupid.mk
          EOF
          fi

          if ! grep -q 'twrp_cupid-eng' "$PRODUCTS_MK"; then
            cat >> "$PRODUCTS_MK" <<'EOF'

          COMMON_LUNCH_CHOICES += \
              twrp_cupid-eng
          EOF
          fi

          echo "===== PRODUCT FILE ====="
          cat "$PRODUCT_MK"

          echo "===== PRODUCT REGISTRATION ====="
          cat "$PRODUCTS_MK"

      - name: Detect release configuration
        id: release
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          RELEASE_DIR="build/release/release_configs"

          if [[ ! -d "$RELEASE_DIR" ]]; then
            echo "::error::Folder release config tidak ditemukan."
            exit 1
          fi

          find "$RELEASE_DIR" -maxdepth 1 -type f \
            \( -name '*.textproto' -o -name '*.mk' \) \
            -printf '%f\n' | sort

          RELEASE=""

          for candidate in ap2a bp1a cp1a; do
            if [[ -f "$RELEASE_DIR/$candidate.textproto" || \
                  -f "$RELEASE_DIR/$candidate.mk" ]]; then
              RELEASE="$candidate"
              break
            fi
          done

          if [[ -z "$RELEASE" ]]; then
            echo "::error::Release config yang sesuai tidak ditemukan."
            exit 1
          fi

          echo "Release config terpilih: $RELEASE"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Build OrangeFox recovery
        shell: bash
        env:
          TARGET_RELEASE: ${{ steps.release.outputs.release }}
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE="$DEVICE"
          export TARGET_RELEASE
          export BUILD_USERNAME=github-actions
          export BUILD_HOSTNAME=github-actions
          export LC_ALL=C

          source build/envsetup.sh

          LUNCH_TARGET="twrp_${DEVICE}-${TARGET_RELEASE}-eng"

          echo "Lunch target: $LUNCH_TARGET"

          if ! lunch "$LUNCH_TARGET"; then
            echo "::error::Lunch target gagal: $LUNCH_TARGET"
            exit 1
          fi

          mka adbd recoveryimage -j"$ANDROID_JOBS"

      - name: Verify recovery image
        shell: bash
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/fox-source"

          PRODUCT_OUT="out/target/product/$DEVICE"
          IMAGE=""

          for candidate in \
            "$PRODUCT_OUT/recovery.img" \
            "$PRODUCT_OUT/OrangeFox-unofficial-${DEVICE}.img" \
            "$PRODUCT_OUT/OrangeFox-${DEVICE}.img"; do
            if [[ -s "$candidate" ]]; then
              IMAGE="$candidate"
              break
            fi
          done

          if [[ -z "$IMAGE" ]]; then
            echo "::error::recovery.img tidak ditemukan."
            ls -lah "$PRODUCT_OUT" || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$IMAGE" "$GITHUB_WORKSPACE/artifacts/recovery.img"

          stat -c '%n - %s bytes' \
            "$GITHUB_WORKSPACE/artifacts/recovery.img"

      - name: Upload recovery.img
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-cupid-recovery
          path: artifacts/recovery.img
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
