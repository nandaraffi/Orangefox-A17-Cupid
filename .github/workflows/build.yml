
name: Build OrangeFox - Xiaomi 12 (cupid)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orangefox-cupid-build
  cancel-in-progress: false

jobs:
  build:
    name: Build recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      DEVICE: cupid
      DEVICE_PATH: device/xiaomi/cupid
      COMMON_PATH: device/xiaomi/sm8450-common

      FOX_BRANCH: fox_12.1
      DEVICE_BRANCH: lineage-24.0
      COMMON_BRANCH: lineage-24.0

      VENDOR_DEVICE_URL: https://github.com/TheMuppets/proprietary_vendor_xiaomi_cupid.git
      VENDOR_DEVICE_BRANCH: lineage-23.2
      VENDOR_COMMON_URL: https://github.com/TheMuppets/proprietary_vendor_xiaomi_sm8450-common.git
      VENDOR_COMMON_BRANCH: lineage-23.2

      ANDROID_JOBS: "2"

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Check available disk space
        run: |
          set -e
          df -h
          echo "Free space should be sufficient for a full Android recovery build."

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3 python-is-python3 \
            openjdk-17-jdk

      - name: Install repo tool
        run: |
          set -e
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize OrangeFox source
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"

          repo init --depth=1 \
            -u https://gitlab.com/OrangeFox/manifest.git \
            -b "$FOX_BRANCH"

      - name: Sync OrangeFox source
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"
          repo sync -c --force-sync --no-clone-bundle \
            --no-tags -j2

      - name: Fetch device tree and common tree
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"

          mkdir -p device/xiaomi

          git clone --depth=1 \
            --branch "$DEVICE_BRANCH" \
            https://github.com/nandaraffi/android_device_xiaomi_cupid.git \
            "$DEVICE_PATH"

          git clone --depth=1 \
            --branch "$COMMON_BRANCH" \
            https://github.com/nandaraffi/android_device_xiaomi_sm8450-common.git \
            "$COMMON_PATH"

      - name: Fetch vendor repositories
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"

          mkdir -p vendor/xiaomi

          git clone --depth=1 \
            --branch "$VENDOR_DEVICE_BRANCH" \
            "$VENDOR_DEVICE_URL" \
            vendor/xiaomi/cupid

          git clone --depth=1 \
            --branch "$VENDOR_COMMON_BRANCH" \
            "$VENDOR_COMMON_URL" \
            vendor/xiaomi/sm8450-common

      - name: Validate device tree and vendor files
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"

          required_files="
          device/xiaomi/cupid/BoardConfig.mk
          device/xiaomi/cupid/device.mk
          device/xiaomi/cupid/lineage.dependencies
          device/xiaomi/sm8450-common/BoardConfig.mk
          vendor/xiaomi/cupid/BoardConfigVendor.mk
          vendor/xiaomi/cupid/cupid-vendor.mk
          vendor/xiaomi/sm8450-common
          "

          for path in $required_files; do
            if [ ! -e "$path" ]; then
              echo "::error::Required file or directory missing: $path"
              exit 1
            fi
          done

          echo "Checking device-tree dependency declarations..."
          python3 - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("device/xiaomi/cupid/lineage.dependencies"),
              Path("device/xiaomi/sm8450-common/lineage.dependencies"),
          ]

          for path in files:
              if not path.exists():
                  print(f"NOTICE: {path} not found; dependency check skipped.")
                  continue

              try:
                  deps = json.loads(path.read_text())
              except Exception as exc:
                  raise SystemExit(f"Invalid JSON in {path}: {exc}")

              print(f"\nDependencies declared in {path}:")
              for dep in deps:
                  print(
                      " -",
                      dep.get("repository", "<unknown repository>"),
                      "=>",
                      dep.get("target_path", "<unknown target path>"),
                  )
          PY

          echo "Device and vendor structure checks passed."

      - name: Verify recovery product configuration
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/android"

          echo "Searching for an existing cupid recovery product..."
          find device/xiaomi/cupid -maxdepth 2 -type f \
            \( -name 'fox_cupid.mk' -o -name 'twrp_cupid.mk' \) \
            -print

          if ! grep -R -E \
            'fox_cupid|twrp_cupid' \
            device/xiaomi/cupid/AndroidProducts.mk \
            device/xiaomi/cupid 2>/dev/null; then
            echo "::error::No registered cupid recovery product was found."
            echo "The LineageOS tree needs a verified OrangeFox/TWRP product makefile before building."
            echo "The workflow will stop rather than fabricate an unverified product configuration."
            exit 1
          fi

      - name: Configure build environment
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"

          export USE_CCACHE=1
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"
          ccache -M 5G

          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"

      - name: Build OrangeFox recovery image
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"

          source build/envsetup.sh

          if lunch fox_cupid-eng; then
            echo "Selected fox_cupid-eng"
          elif lunch twrp_cupid-eng; then
            echo "Selected twrp_cupid-eng"
          else
            echo "::error::Neither fox_cupid-eng nor twrp_cupid-eng is available."
            exit 1
          fi

          mka adbd recoveryimage -j"$ANDROID_JOBS"

      - name: Verify recovery image
        id: verify
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/android"

          IMAGE="out/target/product/cupid/recovery.img"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::recovery.img was not produced."
            find out/target/product/cupid -maxdepth 2 -type f \
              \( -name '*.img' -o -name '*.zip' \) -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$IMAGE" "$GITHUB_WORKSPACE/output/recovery.img"

          sha256sum "$GITHUB_WORKSPACE/output/recovery.img" \
            | tee "$GITHUB_WORKSPACE/output/SHA256SUMS.txt"

          ls -lh "$GITHUB_WORKSPACE/output/recovery.img"

      - name: Upload recovery.img artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-cupid-recovery
          path: |
            output/recovery.img
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
